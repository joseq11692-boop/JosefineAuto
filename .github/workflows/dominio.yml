name: Dominio propio

# Conecta o desconecta josefineauto.com según si su DNS ya apunta a GitHub Pages.
# Mientras el DNS no esté listo, deja la web en joseq11692-boop.github.io para que no se caiga.
on:
  push:
    paths:
      - ".github/workflows/dominio.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar DNS y ajustar el dominio
        env:
          GH_TOKEN: ${{ github.token }}
          DOMINIO: josefineauto.com
        run: |
          ips=$(dig +short A "$DOMINIO" | sort | tr '\n' ' ')
          echo "DNS de $DOMINIO: ${ips:-sin registros}"
          actual=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // ""')
          echo "Dominio configurado en Pages: ${actual:-ninguno}"
          if echo "$ips" | grep -q "185.199.108.153"; then
            if [ "$actual" != "$DOMINIO" ]; then
              gh api -X PUT "repos/${{ github.repository }}/pages" -f cname="$DOMINIO" -f build_type=workflow
              echo "Dominio conectado."
            fi
          elif [ -n "$actual" ]; then
            gh api -X PUT "repos/${{ github.repository }}/pages" -F cname=null -f build_type=workflow
            echo "DNS aún no listo: dominio quitado para que la web siga abriendo."
          fi
