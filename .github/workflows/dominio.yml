name: Dominio propio

# Mantiene josefineauto.com conectado y seguro (HTTPS) sin que el dueño toque GitHub:
# - si el DNS apunta a GitHub Pages y falta el dominio, lo pone;
# - cuando el certificado está emitido, activa "Enforce HTTPS";
# - si el certificado falla, avisa (arreglarlo exige quitar y poner el dominio: lo decide el dueño).
# Nunca quita el dominio por sí solo; solo a mano con repedir=true (lo quita y lo pone una vez, con reintentos).
# Un fallo momentáneo de DNS no puede tumbar la web (lección patron_dominio-antes-dns).
on:
  push:
    branches: [claude/vibrant-dijkstra-gm1tot]
    paths:
      - ".github/workflows/dominio.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      repedir:
        description: "Volver a pedir el certificado (quita y pone el dominio una vez; solo con el DNS ya correcto)"
        type: boolean
        default: false

permissions:
  pages: write
  contents: read

concurrency:
  group: dominio
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Revisar DNS, certificado y HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
          DOMINIO: josefineauto.com
          REPO: ${{ github.repository }}
        run: |
          ips=$(dig +short A "$DOMINIO" | sort | tr '\n' ' ')
          echo "DNS de $DOMINIO: ${ips:-sin registros}"
          pages=$(gh api "repos/$REPO/pages")
          cname=$(jq -r '.cname // ""' <<<"$pages")
          forzado=$(jq -r '.https_enforced // false' <<<"$pages")
          cert=$(jq -r '.https_certificate.state // "sin certificado"' <<<"$pages")
          echo "Dominio en Pages: ${cname:-ninguno} · certificado: $cert · HTTPS forzado: $forzado"

          if ! grep -q "185.199.108.153" <<<"$ips"; then
            echo "El DNS no apunta a GitHub Pages: no se cambia nada."
            exit 0
          fi
          if [ "${{ inputs.repedir }}" = "true" ] && [ "$cert" != "approved" ]; then
            # Solo a mano y con el DNS ya comprobado arriba: GitHub pide el certificado al guardar el dominio
            gh api -X PUT "repos/$REPO/pages" -F cname=null -f build_type=workflow
            sleep 5
            # Volver a poner el dominio pase lo que pase: reintentos y comprobación final
            for i in 1 2 3 4 5; do
              gh api -X PUT "repos/$REPO/pages" -f cname="$DOMINIO" -f build_type=workflow && break || true
              sleep 10
            done
            vuelta=$(gh api "repos/$REPO/pages" --jq '.cname // ""' || true)
            if [ "$vuelta" != "$DOMINIO" ]; then
              echo "::error::El dominio no quedó puesto (está: '${vuelta:-ninguno}'). El cron lo vuelve a poner en 15 min; si no, ponlo en Settings → Pages."
              exit 1
            fi
            echo "Dominio vuelto a guardar: GitHub pide el certificado de nuevo (tarda hasta 1 hora)."
            exit 0
          fi
          if [ "$cname" != "$DOMINIO" ]; then
            gh api -X PUT "repos/$REPO/pages" -f cname="$DOMINIO" -f build_type=workflow
            echo "Dominio conectado; GitHub pedirá el certificado."
            exit 0
          fi
          case "$cert" in
            approved)
              if [ "$forzado" != "true" ]; then
                gh api -X PUT "repos/$REPO/pages" -F https_enforced=true -f build_type=workflow
                echo "HTTPS activado."
              else
                echo "Todo en orden: certificado emitido y HTTPS forzado."
              fi ;;
            errored|bad_authz|destroy_pending|dns_changed|authorization_revoked)
              # No se arregla solo sin quitar el dominio (prohibido): solo se avisa
              echo "::warning::Certificado con problema ($cert). Hace falta el dueño: Settings → Pages → Remove y volver a poner el dominio." ;;
            *)
              echo "Certificado en proceso ($cert): se revisa de nuevo en 15 minutos." ;;
          esac
