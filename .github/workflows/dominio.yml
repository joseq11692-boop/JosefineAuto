name: Dominio propio

# Vigila josefineauto.com: DNS, certificado HTTPS y si el candado está forzado.
# Solo LEE: GitHub no deja que el token de Actions cambie la configuración de Pages
# (403 "Resource not accessible by integration", ejecución 37391234867). Los cambios los hace el dueño
# en Settings → Pages (ver PENDIENTE-DUENO.md). Nunca quita el dominio.
on:
  push:
    branches: [claude/vibrant-dijkstra-gm1tot]
    paths:
      - ".github/workflows/dominio.yml"
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  pages: read
  contents: read

concurrency:
  group: dominio
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Revisar DNS, certificado y HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
          DOMINIO: josefineauto.com
          REPO: ${{ github.repository }}
        run: |
          ips=$(dig +short A "$DOMINIO" | sort | tr '\n' ' ')
          pages=$(gh api "repos/$REPO/pages")
          cname=$(jq -r '.cname // ""' <<<"$pages")
          forzado=$(jq -r '.https_enforced // false' <<<"$pages")
          cert=$(jq -r '.https_certificate.state // "sin certificado"' <<<"$pages")
          resumen="DNS: ${ips:-sin registros} · dominio en Pages: ${cname:-ninguno} · certificado: $cert · HTTPS forzado: $forzado"
          echo "$resumen"
          echo "### Estado de $DOMINIO" >> "$GITHUB_STEP_SUMMARY"
          echo "$resumen" >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q "185.199.108.153" <<<"$ips"; then echo "::warning::El DNS de $DOMINIO no apunta a GitHub Pages."; fi
          if [ "$cname" != "$DOMINIO" ]; then echo "::warning::El dominio no está puesto en Settings → Pages."; fi
          if [ "$cert" = "approved" ] && [ "$forzado" != "true" ]; then echo "::warning::Certificado listo: falta marcar Enforce HTTPS en Settings → Pages."; fi
          case "$cert" in errored|bad_authz|destroy_pending|dns_changed|authorization_revoked|"sin certificado")
            echo "::warning::Sin certificado válido ($cert): en Settings → Pages, Remove y volver a poner el dominio." ;; esac
